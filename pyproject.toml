[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-workload-forecasting"
version = "1.0.0"
description = "Candidate starter utilities for a cloud workload forecasting take-home"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebooks = ["matplotlib>=3.8", "jupyter>=1.0", "nbformat>=5.9", "nbclient>=0.9", "nbconvert>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]